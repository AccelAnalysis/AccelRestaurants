name: Lint audio feature

on:
  push:
    branches:
      - feature/audio-experience-plane
    paths:
      - .github/workflows/lint-audio-feature.yml

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        working-directory: accel_preview
        run: npm ci

      - name: Lint
        working-directory: accel_preview
        run: npm run lint

      - name: Remove one-shot lint workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lint-audio-feature.yml
          git commit -m "chore: complete audio feature lint check"
          git push origin HEAD:feature/audio-experience-plane
