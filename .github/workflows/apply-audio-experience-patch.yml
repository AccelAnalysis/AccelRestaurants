name: Apply audio experience patch

on:
  push:
    branches:
      - feature/audio-experience-plane
    paths:
      - .github/patches/apply_audio_patch.py
      - .github/workflows/apply-audio-experience-patch.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted App.tsx transformations
        run: python .github/patches/apply_audio_patch.py

      - name: Clear pre-existing strict TypeScript warnings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('accel_preview/src/App.tsx')
          text = p.read_text()
          replacements = [
              (
                  "function CampaignsModule({ campaigns, onUpdateCampaigns, onSave }:",
                  "function CampaignsModule({ campaigns, onSave }:",
              ),
              (
                  "pieData.map((entry, index) => (",
                  "pieData.map((_, index) => (",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one strict-cleanup match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Install dependencies
        working-directory: accel_preview
        run: npm ci

      - name: Build production bundle
        working-directory: accel_preview
        run: npm run build

      - name: Commit transformed application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patches/apply_audio_patch.py .github/workflows/apply-audio-experience-patch.yml
          git add -A
          git commit -m "feat: add cinematic audio experience plane"
          git push origin HEAD:feature/audio-experience-plane
